<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlantis | Jerfume</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="logo">
            <a href="../index.html">Jerfume</a>
        </div>

        <nav class="navigation">
            <a href="../index.html">Home</a>
            <a href="../about.html">About</a>
            <a href="../contact.html">Contact</a>
        </nav>
    </header>


    <!-- MAIN -->
    <main class="product-page">

        <section class="product-card">

            <!-- IMAGE -->
            <div class="product-image">
                <img src="../scent.jpg" alt="Atlantis Body Spray">
            </div>


            <!-- DETAILS -->
            <div class="product-info">

                <h1>Daily scent </h1>

                <div class="info-row">
                    <strong>Price</strong>
                    <em>₱75</em>
                </div>

                <div class="info-row">
                    <strong>In Stock</strong>
                    <em>Yes</em>
                </div>

                <div class="info-row">
                    <strong>Type</strong>
                    <em>Fragrance / cologne</em>
                </div>

                <div class="info-row">
                    <strong>Scent</strong>
                    <em>Fresh and refreshing</em>
                </div>


                <!-- WHY CHOOSE -->
                <div class="why-atlantis">

                    <h2>Why Choose Atlantis?</h2>

                    <ul>
                        <li>Fresh and refreshing scent</li>
                        <li>Suitable for everyday activities</li>
                        <li>Easy to carry and use</li>
                    </ul>

                </div>


                <!-- QUANTITY -->
                <div class="quantity">
                    <label for="quantity">Quantity:</label>
                    <input type="number" id="quantity" value="1" min="1">
                </div>


                <!-- BUTTONS -->
                <div class="buttons">
                    <button type="button">Add to Cart</button>
                    <button type="button">Delivery Method</button>
                </div>


                <!-- OPTIONAL EXTRAS -->
                <fieldset class="extras">

                    <legend>🎁 Optional Extras</legend>

                    <label>
                        <input type="checkbox">
                        Gift Wrapping — ₱30
                    </label>

                    <label>
                        <input type="checkbox">
                        Express Handling — ₱50
                    </label>

                    <label>
                        <input type="checkbox">
                        Personal Message — ₱20
                    </label>

                </fieldset>


                <!-- EMAIL -->
                <div class="order-email">

                    <label for="email">Email:</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                    >

                    <button type="submit">
                        Submit Order
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">
        © 2026 Jerfume Shop. All rights reserved.
    </footer>

</body>
</html>
